    <title>expo-device-hub</title>
    <!-- Server substitutes {{mount}}; trailing slash makes relative asset URLs resolve under the mount. -->
    <base href="{{mount}}/" />
    <script>
      (function () {
        // Skip if the {{mount}} placeholder was never substituted (served statically).
        var mount = '{{mount}}';
        if (mount.charAt(0) !== '{' && window.__EXPO_DEVICE_HUB_BASE_PATH__ == null) {
          window.__EXPO_DEVICE_HUB_BASE_PATH__ = mount;
        }
        var platform = '{{platform}}';
        if (platform === 'ios' || platform === 'android') {
          window.__EXPO_DEVICE_HUB_PLATFORM__ = platform;
        }
        var transport = '{{transport}}';
        if (transport === 'mjpeg' || transport === 'h264' || transport === 'webrtc') {
          window.__EXPO_DEVICE_HUB_TRANSPORT__ = transport;
        }
        if ('{{hideSidebar}}' === 'true') {
          window.__EXPO_DEVICE_HUB_HIDE_SIDEBAR__ = true;
        }
        if ('{{hideBootDevice}}' === 'true') {
          window.__EXPO_DEVICE_HUB_HIDE_BOOT_DEVICE__ = true;
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
